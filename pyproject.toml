[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-plan-radar"
version = "0.1.0"
description = "Crawl AI coding subscription pricing, extract plans (rules + AI), normalize value, track changes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenLlamas" }]
keywords = ["ai", "coding-agent", "pricing", "scraper", "llm", "value-for-money"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
coding-plan-radar = "coding_plan_radar.cli:main"
cpr = "coding_plan_radar.cli:main"

[project.urls]
Homepage = "https://github.com/OpenLlamas/coding-plan-radar"
Repository = "https://github.com/OpenLlamas/coding-plan-radar"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_plan_radar"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "coding_plan_radar/config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
