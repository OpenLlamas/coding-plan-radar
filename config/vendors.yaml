# Vendor catalog for coding-plan-radar.
#
# Add or edit entries freely — this file is the only source of crawl targets.
#   id            unique slug (used in state/report files, --vendors filter)
#   region        global | cn | any label you like (used to group report sections)
#   category      subscription | api | free
#   currency      fallback currency when a price line carries no symbol
#   pricing_url   public page with the plan matrix (must be crawlable; JS-heavy
#                 pages need --render)
#   notes         anything a human reader should know (metering model, caveats)

