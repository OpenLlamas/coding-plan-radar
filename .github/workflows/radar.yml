name: weekly radar

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      render:
        description: "Use Playwright for JS-heavy pages"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright (optional)
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        run: |
          pip install -e ".[render]"
          playwright install --with-deps chromium

      - name: Run radar
        env:
          CPR_AI_BASE_URL: ${{ secrets.CPR_AI_BASE_URL }}
          CPR_AI_API_KEY: ${{ secrets.CPR_AI_API_KEY }}
          CPR_AI_MODEL: ${{ secrets.CPR_AI_MODEL }}
        run: |
          args="run --lang en"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.render }}" = "true" ]; then
            args="$args --render"
          fi
          if [ -z "$CPR_AI_API_KEY" ]; then
            args="$args --no-ai"
          fi
          coding-plan-radar $args

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly radar report $(date -u +%F)"
            git push
          else
            echo "No report changes."
          fi
